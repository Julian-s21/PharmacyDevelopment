services:
  - type: web
    name: pharmasy-prueba
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm --prefix pharmacyFrontend ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: ORACLE_USER
        sync: false
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_CONNECT_STRING
        sync: false
      - key: ORACLE_WALLET_DIR
        value: /etc/secrets
      - key: ORACLE_WALLET_PASSWORD
        sync: false
